name: Build & Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run tests
        run: pytest -q
      - name: Build portable exe
        run: >
          pyinstaller --onefile --windowed --name "PDF-Flatten-Decrypt"
          --collect-all tkinterdnd2 --collect-all pypdfium2 app.py
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: PDF-Flatten-Decrypt-windows
          path: dist/PDF-Flatten-Decrypt.exe
      - name: Publish to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/PDF-Flatten-Decrypt.exe
