name: Build & Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      # Actions pinned to commit SHAs so a moved tag can't change what runs
      # in the release pipeline.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools
          pip install -r requirements-dev.txt
      - name: Audit dependencies for known vulnerabilities
        run: |
          pip install pip-audit
          pip-audit
      - name: Run tests
        run: pytest -q
      - name: Build portable exe
        run: >
          pyinstaller --onefile --windowed --name "PDF-Flatten-Decrypt"
          --collect-all tkinterdnd2 --collect-all pypdfium2 app.py
      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: PDF-Flatten-Decrypt-windows
          path: dist/PDF-Flatten-Decrypt.exe
      - name: Publish to Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          # Publish the exe's SHA-256 so a recipient (or their IT) can verify
          # the download matches this build before whitelisting/running it.
          SHA256=$(sha256sum dist/PDF-Flatten-Decrypt.exe | cut -d' ' -f1)
          {
            echo 'Portable Windows build — download the .exe below. No install needed (double-click to run; Windows SmartScreen: More info -> Run anyway). Output saves to your Desktop as flattened-<name>.pdf.'
            echo ''
            echo 'SHA-256 of PDF-Flatten-Decrypt.exe:'
            echo ''
            echo "    $SHA256"
            echo ''
            echo 'To verify a download, run in PowerShell: Get-FileHash PDF-Flatten-Decrypt.exe — the hash must match the value above.'
          } > release-notes.md
          # GitHub's auth API has been returning intermittent 401s; retry a few times.
          gh release create "$TAG" --title "PDF Flatten & Decrypt $TAG" --notes-file release-notes.md \
            || { echo "Release $TAG already exists; refreshing notes."; gh release edit "$TAG" --notes-file release-notes.md; }
          for attempt in 1 2 3 4 5; do
            if gh release upload "$TAG" dist/PDF-Flatten-Decrypt.exe --clobber; then
              echo "Asset uploaded on attempt $attempt."
              exit 0
            fi
            echo "Upload attempt $attempt failed (likely a transient 401); retrying in 15s…"
            sleep 15
          done
          echo "::error::Could not upload release asset after 5 attempts."
          exit 1
