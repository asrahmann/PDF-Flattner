name: Build & Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      # Actions pinned to commit SHAs so a moved tag can't change what runs
      # in the release pipeline.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools
          pip install -r requirements-dev.txt
      - name: Audit dependencies for known vulnerabilities
        run: |
          pip install pip-audit
          pip-audit
      - name: Run tests
        run: pytest -q
      - name: Build portable exe
        run: >
          pyinstaller --onefile --windowed --name "PDF-Flatten-Decrypt"
          --collect-all tkinterdnd2 --collect-all pypdfium2 app.py
      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: PDF-Flatten-Decrypt-windows
          path: dist/PDF-Flatten-Decrypt.exe
      - name: Publish to Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          # GitHub's auth API has been returning intermittent 401s; retry a few times.
          gh release create "$TAG" --title "PDF Flatten & Decrypt $TAG" \
            --notes "Portable Windows build — download the .exe below. No install needed (double-click to run; Windows SmartScreen: More info -> Run anyway). Output saves to your Desktop as flattened-<name>.pdf." \
            || echo "Release $TAG already exists; updating asset."
          for attempt in 1 2 3 4 5; do
            if gh release upload "$TAG" dist/PDF-Flatten-Decrypt.exe --clobber; then
              echo "Asset uploaded on attempt $attempt."
              exit 0
            fi
            echo "Upload attempt $attempt failed (likely a transient 401); retrying in 15s…"
            sleep 15
          done
          echo "::error::Could not upload release asset after 5 attempts."
          exit 1
